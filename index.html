<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>축구&amp;joy</title>
<meta name="description" content="축구&amp;joy — 우리팀 관리 · 상대 전력 대비 전술보드">
<meta name="theme-color" content="#1f7a4d" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14120f" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="축구&amp;joy">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <span id="brand-logo" class="brand"></span>
    <h1 id="topbar-title">우리팀</h1>
    <span class="spacer"></span>
    <!-- 화면 빌드 표식 — 배포가 실제로 반영됐는지 화면에서 바로 확인한다 -->
    <span class="sub build" id="topbar-sub">v1.0.0-alpha</span>
    <button class="topbtn" id="btn-settings" aria-label="설정">⚙</button>
  </header>

  <main>
    <section id="view-ourteam" class="view active"></section>
    <section id="view-opponent" class="view"></section>
    <section id="view-board" class="view"></section>
    <section id="view-match" class="view"></section>
  </main>

  <nav class="tabbar" role="tablist" aria-label="메인 탭">
    <button role="tab" data-tab="ourteam" data-icon="member" aria-selected="true"><span class="ico"></span>우리팀</button>
    <button role="tab" data-tab="opponent" data-icon="team" aria-selected="false"><span class="ico"></span>상대팀</button>
    <button role="tab" data-tab="board" data-icon="tactic" aria-selected="false"><span class="ico"></span>전술보드</button>
    <button role="tab" data-tab="match" data-icon="ball" aria-selected="false"><span class="ico"></span>경기</button>
  </nav>
</div>

<div class="toast-wrap" id="toasts" aria-live="polite"></div>
<noscript><p style="padding:24px;text-align:center">이 앱은 자바스크립트가 필요합니다.</p></noscript>
<script type="module" src="./app.js"></script>
</body>
</html>
