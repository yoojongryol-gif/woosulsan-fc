<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>축구&amp;joy</title>
<meta name="description" content="축구&amp;joy — 축구 모임 관리 · 회원·출석·팀 나누기·전술판">
<meta name="theme-color" content="#1f7a4d" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14120f" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="축구&amp;joy">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <span id="brand-logo" class="brand"></span>
    <h1 id="topbar-title">축구&amp;joy</h1>
    <span class="spacer"></span>
    <span class="sub" id="topbar-sub"></span>
  </header>

  <main>
    <section id="view-home" class="view active"></section>
    <section id="view-attend" class="view"></section>
    <section id="view-team" class="view"></section>
    <section id="view-tactics" class="view"></section>
    <section id="view-members" class="view"></section>
  </main>

  <nav class="tabbar" role="tablist" aria-label="메인 탭">
    <button role="tab" data-tab="home" data-icon="home" aria-selected="true"><span class="ico"></span>홈</button>
    <button role="tab" data-tab="attend" data-icon="check" aria-selected="false"><span class="ico"></span>출석</button>
    <button role="tab" data-tab="team" data-icon="team" aria-selected="false"><span class="ico"></span>팀</button>
    <button role="tab" data-tab="tactics" data-icon="tactic" aria-selected="false"><span class="ico"></span>전술</button>
    <button role="tab" data-tab="members" data-icon="member" aria-selected="false"><span class="ico"></span>회원</button>
  </nav>
</div>

<div class="toast-wrap" id="toasts" aria-live="polite"></div>
<noscript><p style="padding:24px;text-align:center">이 앱은 자바스크립트가 필요합니다.</p></noscript>
<script type="module" src="./app.js"></script>
</body>
</html>
